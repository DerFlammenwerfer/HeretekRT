- type: entity
  parent: ClothingOuterHardsuitSalvage
  id: ClothingOuterHardsuitMenial
  name: menial voidsuit
  description: A voidsuit patterned for use by technical laborers. Has some low-end armor plating.
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/OuterClothing/Hardsuits/menial.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/OuterClothing/Hardsuits/menial.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.5
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    armorRating: 440
    modifiers:
      coefficients:
        Blunt: 0.45
        Slash: 0.7
        Piercing: 0.75
        Radiation: 0.15
        Caustic: 0.85
  - type: ClothingSpeedModifier
    walkModifier: 0.80
    sprintModifier: 0.80
  - type: HeldSpeedModifier
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.55
  - type: ToggleableClothing # Goobstation - Modsuits change - Mono - this is a solution for helmet attachment/cover to not fit on hardsuits
    requiredSlot: outerclothing
    blockUnequipWhenAttached: false
    replaceCurrentClothing: true
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitMenial
      helmetcover: ClothingHeadHelmetCoverBlock
      helmetattachment: ClothingHeadHelmetAttachmentBlock

- type: entity
  parent: ClothingHeadHelmetHardsuitSalvage
  id: ClothingHeadHelmetHardsuitMenial
  name: menial voidsuit helmet
  description: A voidsuit helmet patterned for use by technical laborers. Has some low-end armor plating and dual floodlights.
  components:
  - type: Sprite
    sprite: _WH40K/Clothing/Head/Hardsuits/menial.rsi
  - type: Clothing
    sprite: _WH40K/Clothing/Head/Hardsuits/menial.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: PointLight
    radius: 8 # 7->8 Mono
    energy: 4 # 3->4 Mono
