- type: htnCompound
  id: WH40KMerchantIdleCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:RandomOperator
        targetKey: IdleTime
        minKey: MinimumIdleTime
        maxKey: MaximumIdleTime
    - !type:HTNPrimitiveTask
      operator: !type:WaitOperator
        key: IdleTime

- type: entity
  id: MarkerWH40KMerchantSpawn
  parent: MarkerBase
  name: Точка спавна торговца
  description: Торговец возвращается сюда, если его унесло дальше трёх тайлов.
  suffix: WH40K, Merchant, Mapping
  components:
  - type: Sprite
    layers:
    - state: pink
      shader: unshaded
  - type: MerchantSpawnMarker

- type: entity
  id: MobWH40KFootfallMerchant
  parent: MobHuman
  name: Лоточник Касс
  description: Он всегда знает, что скоро подорожает, и никогда не объясняет откуда это знает.
  suffix: WH40K, Merchant
  save: false
  components:
  - type: DialogueDisplayName
    name: Лоточник Касс
  - type: RandomHumanoidAppearance
    randomizeName: false
    hair: HairBald
  - type: Loadout
    prototypes:
    - WandererGear
  - type: HTN
    rootTask:
      task: WH40KMerchantIdleCompound
    # Keep the HTN awake on the station. It only waits in place; MerchantSystem
    # handles turning toward the nearest player without starting a movement plan.
    sleepPlayerCheckRangeOverride: 1000000
  - type: Godmode
  - type: UserInterface
    interfaces:
      enum.MerchantUiKey.Key:
        type: MerchantBoundUserInterface
        interactionRange: 3
  - type: ActivatableUI
    key: enum.MerchantUiKey.Key
  - type: Merchant
    title: wh40k-merchant-title
    greeting: wh40k-merchant-greeting
    refreshInterval: 900
    displayCount: 6
    interactionRange: 3
    lookAtRange: 3
    returnDistance: 3
    offers:
    - product: DrinkGuardsmanFlask
      price: 18
      minStock: 2
      maxStock: 7
      weight: 8
      displayName: wh40k-merchant-item-flask
      description: wh40k-merchant-item-flask-desc
    - product: DrinkImperialNutriCan
      price: 24
      minStock: 1
      maxStock: 5
      weight: 7
      displayName: wh40k-merchant-item-nutri-can
      description: wh40k-merchant-item-nutri-can-desc
    - product: FoodSnackImperialHardtack
      price: 12
      minStock: 3
      maxStock: 10
      weight: 9
      displayName: wh40k-merchant-item-hardtack
      description: wh40k-merchant-item-hardtack-desc
    - product: ChaosMedkit
      price: 160
      minStock: 1
      maxStock: 2
      weight: 3
      displayName: wh40k-merchant-item-medkit
      description: wh40k-merchant-item-medkit-desc
    - product: WH40KMiningDrillVoidpiercer
      price: 320
      minStock: 1
      maxStock: 2
      weight: 2
      displayName: wh40k-merchant-item-tool
      description: wh40k-merchant-item-tool-desc
    - product: CatachanKnife
      price: 220
      minStock: 1
      maxStock: 2
      weight: 2
      displayName: wh40k-merchant-item-knife
      description: wh40k-merchant-item-knife-desc
    - product: FoodSnackImperialNutriBar
      price: 20
      minStock: 2
      maxStock: 8
      weight: 8
      displayName: wh40k-merchant-item-nutri-bar
      description: wh40k-merchant-item-nutri-bar-desc
    - product: FoodTinGroxPorridge
      price: 34
      minStock: 1
      maxStock: 5
      weight: 6
      displayName: wh40k-merchant-item-grox-porridge
      description: wh40k-merchant-item-grox-porridge-desc
    - product: FoodTinGroxMeat
      price: 45
      minStock: 1
      maxStock: 4
      weight: 5
      displayName: wh40k-merchant-item-grox-meat
      description: wh40k-merchant-item-grox-meat-desc
    - product: FoodBoxImperialMRESmall
      price: 95
      minStock: 1
      maxStock: 3
      weight: 4
      displayName: wh40k-merchant-item-mre
      description: wh40k-merchant-item-mre-desc
  - type: DialogueInteractable
    interactionRange: 3
    requireLineOfSight: true
    dialogue: WH40KMerchantGreeting
